<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section 
        {
            background-color: aliceblue;
            border: 1px solid black;
            width:80%;
            margin:auto;
            box-shadow: 5px 5px 5px gray;
            display: grid;
            grid-template-columns: 40% 15% 15% 15% 15%;
        }
        div 
        {
            border: 1px solid black;
            padding:10px;
        }
    </style>
</head>
<body>
    <h1>1st example of grid </h1>
    <section>
        <div>name</div>
        <div>html</div>
        <div>css</div>
        <div>javascript</div>
        <div>total</div>
        <div>abc</div>
        <div>45</div>
        <div>55</div>
        <div>65</div>
        <div>145</div>
        <div>bcd</div>
        <div>50</div>
        <div>90</div>
        <div>60</div>
        <div>200</div>
        <div>cde</div>
        <div>60</div>
        <div>70</div>
        <div>80</div>
        <div>210</div>
        <div>def</div>
        <div>60</div>
        <div>80</div>
        <div>70</div>
        <div>210</div>
    </section>
</body>
</html>
